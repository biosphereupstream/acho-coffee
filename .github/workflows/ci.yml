name: CI & Deployment Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Monorepo Frontend & Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type Check (Frontend TypeScript)
        run: npm run typecheck

      - name: Lint (Frontend ESLint)
        run: npm run lint

      - name: Production Build (Frontend Next.js)
        env:
          NEXT_PUBLIC_SITE_URL: https://acho.coffee
          NEXT_PUBLIC_SUPABASE_URL: https://lhohaqrhcrghoqkczvbt.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_dummy_key_for_ci_build
          DOKU_ENV: production
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v ./...
