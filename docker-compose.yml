# Postgres lokal untuk development (opsional — produksi memakai Supabase)
services:
  db:
    image: postgres:16-alpine
    container_name: acho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: acho
    ports:
      - "5432:5432"
    volumes:
      - acho_pgdata:/var/lib/postgresql/data

volumes:
  acho_pgdata:
